# SPDX-License-Identifier: Apache-2.0
# Builds the Windows executable and attaches it to a GitHub Release.
#
# Triggered when a release is published on GitHub (Releases → Draft a new release),
# or manually from the Actions tab (the build is then kept as a workflow artifact only).
# Pull requests that change the pinned versions are built and smoke-tested too.
#
# Everything is installed from pinned lists with hashes (requirements-lock.txt and
# packaging/*-lock.txt), so a release never picks up a new third-party version by surprise.
# To change versions, run `python packaging/update_locks.py` (see that file).
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - requirements-lock.txt
      - "packaging/**"
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies (clean environment, pinned versions)
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --require-hashes -r requirements-lock.txt

      - name: Collect third-party licenses
        # Apache-2.0 / MIT / BSD all require their license (and NOTICE) texts to ship with
        # binary redistributions. Generate them from exactly the packages bundled in the exe.
        # pip-licenses runs from its own environment, so it lists only what Shoji bundles.
        run: |
          python -m venv .tools
          .tools\Scripts\pip install --require-hashes -r packaging/licenses-lock.txt
          $py = (Resolve-Path .venv\Scripts\python.exe).Path
          .tools\Scripts\pip-licenses --python $py --from=mixed --with-urls --with-license-file --with-notice-file `
            --no-license-path --format=plain-vertical --ignore-packages pip setuptools `
            --output-file THIRD_PARTY_LICENSES.txt
          .tools\Scripts\pip-licenses --python $py --from=mixed --format=markdown --ignore-packages pip setuptools
          Add-Content THIRD_PARTY_LICENSES.txt "`n`nPyInstaller bootloader`nGPL-2.0 with a special exception that permits distributing the bundled application under any license.`nhttps://github.com/pyinstaller/pyinstaller/blob/develop/COPYING.txt"

      - name: Build Shoji.exe
        run: |
          .venv\Scripts\pip install --require-hashes -r packaging/build-lock.txt
          .venv\Scripts\pyinstaller packaging/shoji.spec --noconfirm

      - name: Smoke test the executable
        run: |
          $env:SHOJI_DATA = "$env:RUNNER_TEMP\shoji-data"
          $p = Start-Process -FilePath dist\Shoji\Shoji.exe -ArgumentList "--no-system-proxy","--no-browser","--no-tray","--no-dns" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $s = Invoke-RestMethod http://127.0.0.1:8765/api/status -TimeoutSec 3
              if ($s.status.proxy -eq "running") { $ok = $true; break }
            } catch {}
          }
          $log = Get-Content "$env:SHOJI_DATA\shoji.log" -Encoding utf8 -ErrorAction SilentlyContinue
          $log
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            # Surface the log as annotations too (visible on the run page and through the API)
            # (one annotation; GitHub keeps only 10 per step, and %0A is an escaped newline)
            $msg = ($log | Select-Object -Last 60) -join '%0A'
            Write-Output "::error title=shoji.log::$msg"
            throw "Shoji.exe did not start"
          }

      - name: Package
        id: pkg
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "Shoji-$ver-windows-x64"
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_LICENSES.txt, README.md, README.ja.md, SECURITY.md dist\Shoji\
          Compress-Archive -Path dist\Shoji -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "${{ steps.pkg.outputs.name }}.zip" "${{ steps.pkg.outputs.name }}.zip.sha256" --clobber
