<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoji</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{color-scheme:light;
  --bg:#f4f4f2;--surface:#fcfcfb;--surface-2:#f0efec;--border:#e2e1dc;
  --text:#0b0b0b;--text-2:#52514e;--muted:#7a7974;
  --accent:#2a78d6;--series-1:#2a78d6;--series-2:#eb6834;
  --good:#1a7f37;--warn:#b26b00;--bad:#c43c3b;--grid:#e6e5e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--border:#30302d;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#8d8c85;
  --accent:#3987e5;--series-1:#3987e5;--series-2:#d95926;
  --good:#4cb86a;--warn:#e0a030;--bad:#e66767;--grid:#2a2a28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.02em}
header h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--surface-2)}
.pill.on::before{content:"● ";color:var(--good)} .pill.off::before{content:"● ";color:var(--bad)}
nav{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
nav button{border:0;background:none;color:var(--text-2);padding:11px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
section{display:none} section.active{display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font:inherit;color:var(--text-2);cursor:pointer}
.seg button.active{background:var(--accent);color:#fff}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi .label{color:var(--text-2);font-size:12.5px}
.kpi .value{font-size:28px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .sub{color:var(--muted);font-size:12px}
.kpi .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:18px 0 8px}
.two{grid-template-columns:1fr 1fr} @media (max-width:820px){.two{grid-template-columns:1fr}}
.chart-wrap{position:relative}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:5}
svg text{fill:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
th{color:var(--text-2);font-weight:500;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--series-1);opacity:.85}
.bar.t{background:var(--series-2)}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.muted{color:var(--muted)} .small{font-size:12px}
.toggle-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.toggle .t{font-weight:600} .toggle .d{color:var(--text-2);font-size:12.5px}
.switch{position:relative;display:inline-block;flex:0 0 38px;width:38px;height:22px;margin-top:2px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)} .switch input:checked+span::after{transform:translateX(16px)}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:340px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.step .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:600}
.ok{color:var(--good)} .ng{color:var(--bad)}
code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;font-size:13px}
.log td{font-size:12px} .log td.d{color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log-table{table-layout:fixed;min-width:860px}
#log-table td{vertical-align:top;overflow:hidden;text-overflow:ellipsis}
#log-table td.u{white-space:nowrap} #log-table td.u div{overflow:hidden;text-overflow:ellipsis}
#log-table .sub{color:var(--muted);font-size:11.5px}
#log-table td.r{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all}
.res{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.res.blocked{color:#fff;background:var(--bad);border-color:var(--bad)}
.res.modified{color:var(--warn);border-color:var(--warn)}
.res.page{color:var(--accent);border-color:var(--accent)}
.res.allowed{color:var(--good);border-color:var(--good)}
.res.passed,.res.passthrough{color:var(--muted)}
.mini{font-size:11.5px;padding:2px 9px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:20}
#modal .card{width:min(620px,calc(100% - 32px))}
#modal input{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1><img src="/icon.svg" alt="" width="22" height="22" style="vertical-align:-4px;margin-right:8px">Shoji<span id="ver"></span></h1>
  <div class="pills" id="pills"></div>
  <select id="lang-select" aria-label="Language" style="padding:3px 8px;font-size:12.5px">
    <option value="auto" data-i="lang.auto"></option><option value="ja">日本語</option><option value="en">English</option>
  </select>
  <button class="btn" id="pause-btn" style="padding:4px 12px;font-size:12.5px" data-i="pause"></button>
</header>
<nav id="tabs">
  <button data-tab="stats" class="active" data-i="tab.stats"></button>
  <button data-tab="log" data-i="tab.log"></button>
  <button data-tab="settings" data-i="tab.settings"></button>
  <button data-tab="stealth" data-i="tab.stealth"></button>
  <button data-tab="allow" data-i="tab.allow"></button>
  <button data-tab="filters" data-i="tab.filters"></button>
  <button data-tab="setup" data-i="tab.setup"></button>
</nav>
<main>
<!-- ================= 統計 ================= -->
<section id="stats" class="active">
  <div class="row">
    <div class="seg" id="period">
      <button data-d="1" class="active" data-i="period.1"></button><button data-d="7" data-i="period.7"></button><button data-d="30" data-i="period.30"></button><button data-d="0" data-i="period.0"></button>
    </div>
    <span class="muted small" id="updated"></span>
    <span style="flex:1"></span>
    <a class="btn" id="csv" href="/api/report.csv?days=30" data-i="csv"></a>
    <button class="btn" id="reset" data-i="stats.reset"></button>
  </div>
  <div class="grid kpis" id="kpis"></div>
  <div class="grid two" style="margin-top:12px">
    <div class="card">
      <h2 id="chart-title" data-i="chart.title"></h2>
      <div class="legend"><span><i style="background:var(--series-1)"></i><span data-i="cat.ad"></span></span><span><i style="background:var(--series-2)"></i><span data-i="cat.tracker"></span></span></div>
      <div class="chart-wrap" id="chart"></div>
    </div>
    <div class="card">
      <h2 data-i="breakdown"></h2>
      <table id="breakdown"></table>
    </div>
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card"><h2 data-i="top.ad"></h2><table id="top-ad"></table></div>
    <div class="card"><h2 data-i="top.tracker"></h2><table id="top-tracker"></table></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2 data-i="recent"></h2>
    <table class="log" id="recent"></table>
  </div>
  <p class="muted small" data-i="stats.note"></p>
</section>

<!-- ================= フィルタリングログ ================= -->
<section id="log">
  <div class="row">
    <div class="seg" id="log-filter">
      <button data-a="" class="active" data-i="log.all"></button><button data-a="blocked" data-i="res.blocked"></button><button data-a="passed" data-i="res.passed"></button><button data-a="modified" data-i="res.modified"></button><button data-a="page" data-i="res.page"></button><button data-a="passthrough" data-i="res.passthrough"></button><button data-a="allowed" data-i="res.allowed"></button>
    </div>
    <input type="text" id="log-q" data-i-ph="log.search" style="flex:1;min-width:200px">
    <button class="btn" id="log-pause" data-i="log.pause"></button>
    <button class="btn" id="log-clear" data-i="clear"></button>
  </div>
  <p class="muted small" id="log-note" data-i="log.note"></p>
  <div class="card" style="padding:0;overflow:auto">
    <table class="log" id="log-table">
      <colgroup><col style="width:74px"><col style="width:104px"><col style="width:90px"><col><col style="width:30%"><col style="width:84px"></colgroup>
      <thead><tr><th data-i="col.time"></th><th data-i="log.col.result"></th><th data-i="col.kind"></th><th data-i="log.col.url"></th><th data-i="log.col.rule"></th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- ================= 機能設定 ================= -->
<section id="settings">
  <div class="toggle-list" id="feature-toggles"></div>
</section>

<!-- ================= ステルス ================= -->
<section id="stealth">
  <p class="muted" data-i="stealth.intro"></p>
  <div class="toggle-list" id="stealth-toggles"></div>
  <div class="card" style="margin-top:12px">
    <label><span data-i="cookie.label"></span>
      <input type="text" id="cookie-hours" style="width:90px;margin-left:8px">
    </label>
    <button class="btn" id="cookie-save" style="margin-left:6px" data-i="save"></button>
  </div>
</section>

<!-- ================= 許可リスト ================= -->
<section id="allow">
  <div class="grid two">
    <div class="card">
      <h2 data-i="allow.title"></h2>
      <p class="muted small" data-i="allow.desc"></p>
      <div class="row"><input type="text" id="wl-input" placeholder="example.com" style="flex:1"><button class="btn pri" id="wl-add" data-i="add"></button></div>
      <div class="chips" id="wl"></div>
      <h3 data-i="recent.sites"></h3>
      <p class="muted small" data-i-html="recent.sites.desc"></p>
      <div class="chips" id="recent-sites"></div>
    </div>
    <div class="card">
      <h2 data-i="ex.title"></h2>
      <p class="muted small"><span id="ex-desc"></span> <a href="#" id="bx-toggle" data-i="ex.show"></a></p>
      <div class="chips muted small" id="bx" style="display:none"></div>
      <div class="row"><input type="text" id="ex-input" placeholder="bank.example.com" style="flex:1"><button class="btn pri" id="ex-add" data-i="add"></button></div>
      <div class="chips" id="ex"></div>
      <h3><span data-i="pt.title"></span> <button class="btn" id="pt-clear" style="font-size:12px;padding:3px 10px" data-i="clear"></button></h3>
      <p class="muted small" data-i="pt.desc"></p>
      <div class="chips" id="pt"></div>
    </div>
  </div>
</section>

<!-- ================= フィルタ ================= -->
<section id="filters">
  <div class="card">
    <div class="row"><h2 style="margin:0" data-i="lists.title"></h2><span style="flex:1"></span><span class="muted small" id="rule-summary"></span><button class="btn pri" id="update-lists" data-i="lists.update"></button></div>
    <table id="lists"></table>
    <p class="muted small" style="margin:8px 0 0" data-i="lists.note"></p>
  </div>
  <div class="grid two" style="margin-top:12px">
    <div class="card">
      <h2 data-i="ur.title"></h2>
      <p class="muted small" data-i-html="ur.desc"></p>
      <textarea id="user-rules" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn pri" id="save-rules" data-i="ur.save"></button></div>
    </div>
    <div class="card">
      <h2 data-i="chk.title"></h2>
      <p class="muted small" data-i="chk.desc"></p>
      <input type="text" id="chk-url" placeholder="https://ads.example.com/banner.js" style="width:100%">
      <div class="row" style="margin-top:8px">
        <input type="text" id="chk-page" data-i-ph="chk.page" style="flex:1">
        <select id="chk-type"><option value="script">script</option><option value="image">image</option><option value="sub_frame">iframe</option><option value="xmlhttprequest">xhr</option><option value="document">document</option><option value="other">other</option></select>
        <button class="btn" id="chk-go" data-i="chk.go"></button>
      </div>
      <pre id="chk-out" class="small" style="white-space:pre-wrap"></pre>
    </div>
  </div>
</section>

<!-- ================= セットアップ ================= -->
<section id="setup">
  <div class="card">
    <div class="step"><div class="n">1</div><div style="flex:1">
      <b data-i="setup.cert"></b> <span id="st-cert"></span>
      <p class="muted small" data-i="setup.cert.desc"></p>
      <button class="btn pri" id="do-cert" data-i="setup.cert.install"></button> <a class="btn" href="/cert" data-i="setup.cert.download"></a>
      <p class="muted small" data-i="setup.cert.ff"></p>
    </div></div>
    <div class="step"><div class="n">2</div><div style="flex:1">
      <b data-i="setup.proxy"></b> <span id="st-proxy"></span>
      <p class="muted small" data-i="setup.proxy.desc"></p>
      <button class="btn pri" id="proxy-on" data-i="setup.proxy.on"></button> <button class="btn" id="proxy-off" data-i="setup.proxy.off"></button>
    </div></div>
    <div class="step"><div class="n">★</div><div style="flex:1">
      <b data-i="setup.auto"></b> <span id="st-auto"></span>
      <p class="muted small" data-i="setup.auto.desc"></p>
      <label class="toggle" style="max-width:420px"><span class="switch"><input type="checkbox" id="auto-toggle"><span></span></span><span><div class="t" data-i="setup.auto.t"></div><div class="d" data-i="setup.auto.d"></div></span></label>
    </div></div>
    <div class="step"><div class="n">3</div><div style="flex:1">
      <b data-i="setup.dns"></b> <span id="st-dns"></span>
      <p class="muted small" data-i-html="setup.dns.desc"></p>
      <button class="btn" id="dns-on" data-i="setup.dns.on"></button> <button class="btn" id="dns-off" data-i="setup.dns.off"></button>
    </div></div>
    <div class="step"><div class="n">4</div><div style="flex:1">
      <b data-i="setup.lan"></b>
      <p class="muted small" data-i-html="setup.lan.desc"></p>
    </div></div>
    <div class="step"><div class="n">🌐</div><div style="flex:1">
      <b data-i="setup.lang"></b>
      <p class="muted small" data-i="setup.lang.desc"></p>
      <select id="lang-select2"><option value="auto" data-i="lang.auto"></option><option value="ja">日本語</option><option value="en">English</option></select>
    </div></div>
  </div>
</section>
</main>
<div id="toast"></div>
<div id="modal"><div class="card">
  <h2 id="modal-title"></h2>
  <p class="muted small" id="modal-desc"></p>
  <input type="text" id="modal-rule" spellcheck="false">
  <div class="row" style="margin-top:12px;justify-content:flex-end;margin-bottom:0">
    <button class="btn" id="modal-cancel" data-i="modal.cancel"></button><button class="btn pri" id="modal-ok" data-i="modal.ok"></button>
  </div>
</div></div>
<script src="/i18n.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CFG = null, DAYS = 1, LANG = 'ja', LOCALE = 'ja-JP';

/* ---------- 言語 ---------- */
// 文言を取り出す。{name} を差し込む。配列（機能の名前と説明）はそのまま返す
function t(key, vars) {
  const d = SHOJI_I18N[LANG] || SHOJI_I18N.ja;
  let s = d[key] !== undefined ? d[key] : (SHOJI_I18N.ja[key] !== undefined ? SHOJI_I18N.ja[key] : key);
  if (typeof s === 'string' && vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
  return s;
}
function applyLang(lang) {
  LANG = SHOJI_I18N[lang] ? lang : 'en';
  LOCALE = LANG === 'ja' ? 'ja-JP' : 'en-US';
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-i-html]').forEach(el => { el.innerHTML = t(el.dataset.iHtml); });   // 自前の文言だけ
  document.querySelectorAll('[data-i-ph]').forEach(el => { el.placeholder = t(el.dataset.iPh); });
}
const fmt = n => (n || 0).toLocaleString(LOCALE);

function toast(msg) { const el = $('#toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2600); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
function bytes(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(1) + ' MB';
  return Math.round(b / 1e3) + ' KB';
}
function dur(ms) {
  const s = ms / 1000;
  if (s >= 3600) return t('unit.h', {n: (s / 3600).toFixed(1)});
  if (s >= 60) return t('unit.m', {n: (s / 60).toFixed(1)});
  return t('unit.s', {n: s.toFixed(1)});
}

/* ---------- タブ ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === b.dataset.tab));
  if (b.dataset.tab === 'filters') loadFilters();
  if (b.dataset.tab === 'log') pollLog();
  if (b.dataset.tab === 'allow') loadRecentSites();
});

/* ---------- フィルタリングログ ---------- */
const LOG = {items: [], last: 0, action: '', q: '', enabled: true, timer: null};
function hhmmss(ts) { const d = new Date(ts * 1000); return d.toTimeString().slice(0, 8); }
function suggestRule(e) {
  if (e.action === 'blocked') {
    if (e.src === 'dns' || !e.page || e.page === e.host) return '@@||' + e.host + '^';
    return '@@||' + e.host + '^$domain=' + e.page;
  }
  if (e.page && e.page === e.host && e.rtype !== 'document') {
    // サイト自身のファイルはドメインごと止めると壊れやすいので URL で指定する
    return '||' + e.url.replace(/^https?:\/\//, '').split(/[?#]/)[0];
  }
  return '||' + e.host + '^';
}
function logRow(e) {
  const btn = e.action === 'blocked' ? `<button class="btn mini" data-allow="${e.id}">${t('log.allow')}</button>`
    : (e.action === 'passed' || e.action === 'modified') && e.rtype !== 'document' ? `<button class="btn mini" data-block="${e.id}">${t('log.block')}</button>` : '';
  const type = e.src === 'dns' ? 'DNS ' + esc(e.method) : (e.rtype ? t('type.' + e.rtype) : esc(e.method || ''));
  const page = e.page && e.page !== e.host ? `<div class="sub">${esc(e.page)}</div>` : '';
  const status = e.status > 0 ? `<span class="sub"> ${e.status}</span>` : (e.status < 0 ? `<span class="sub ng"> ${t('log.error')}</span>` : '');
  const rule = e.rule ? `<div>${esc(e.rule)}</div>` : '';
  const detail = e.detail ? `<div class="sub">${esc(e.detail)}</div>` : '';
  return `<tr><td class="sub">${hhmmss(e.t)}</td><td><span class="res ${e.action}">${esc(t('res.' + e.action))}</span></td>`
    + `<td class="sub">${type}${status}</td><td class="u" title="${esc(e.url)}"><div>${esc(e.url)}</div>${page}</td>`
    + `<td class="r">${rule}${detail}</td><td>${btn}</td></tr>`;
}
function renderLog() {
  const q = LOG.q.toLowerCase();
  const rows = [];
  for (const e of LOG.items) {
    if (LOG.action && e.action !== LOG.action) continue;
    if (q && !(e.url.toLowerCase().includes(q) || e.rule.toLowerCase().includes(q) || (e.page || '').includes(q))) continue;
    rows.push(logRow(e));
    if (rows.length >= 400) break;
  }
  $('#log-table tbody').innerHTML = rows.join('') || `<tr><td colspan="6" class="muted">${t('log.empty')}</td></tr>`;
}
function setLogButton() { $('#log-pause').textContent = t(LOG.enabled ? 'log.pause' : 'log.resume'); }
async function pollLog() {
  clearTimeout(LOG.timer);
  if (!$('#log').classList.contains('active')) return;
  try {
    const r = await api('/api/log?limit=3000&since=' + LOG.last);
    if (r.last < LOG.last) LOG.items = [];          // Shoji が再起動した
    if (r.items.length) { LOG.items = r.items.concat(LOG.items).slice(0, 3000); renderLog(); }
    else if (!LOG.items.length) renderLog();
    LOG.last = r.last;
    LOG.enabled = r.enabled; setLogButton();
  } catch (e) { /* 再試行 */ }
  LOG.timer = setTimeout(pollLog, 1500);
}

const CATS = ['ad', 'tracker', 'security', 'annoyance', 'popup', 'youtube', 'reinserted', 'cosmetic', 'amp', 'stealth_param', 'stealth_cookie', 'stealth_header'];
const catLabel = c => CATS.includes(c) ? t('cat.' + c) : c;

async function loadReport() {
  const r = await api('/api/report?days=' + DAYS);
  const T = k => (r.totals[k] || {}).count || 0;
  const src = (k, s) => ((r.by_source[k] || {})[s] || 0);
  const kpi = (label, value, sub, color, tip) => `<div class="card kpi"${tip ? ` title="${esc(tip)}"` : ''}><div class="label">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(label)}</div><div class="value">${value}</div><div class="sub">${sub ? esc(sub) : '&nbsp;'}</div></div>`;
  $('#kpis').innerHTML =
    kpi(t('kpi.ad'), fmt(T('ad')), t('kpi.via', {p: fmt(src('ad', 'proxy')), d: fmt(src('ad', 'dns'))}), 'var(--series-1)') +
    kpi(t('kpi.tracker'), fmt(T('tracker')), t('kpi.via', {p: fmt(src('tracker', 'proxy')), d: fmt(src('tracker', 'dns'))}), 'var(--series-2)') +
    kpi(t('kpi.bytes'), bytes(r.saved_bytes), t('kpi.estimate')) +
    kpi(t('kpi.time'), dur(r.saved_ms), t('kpi.estimate')) +
    kpi(t('kpi.video'), fmt(T('youtube')), t('kpi.video.sub')) +
    kpi(t('kpi.popup'), fmt(T('popup')), t('kpi.popup.sub')) +
    kpi(t('kpi.share'), (r.block_ratio * 100).toFixed(1) + '%',
        t('kpi.share.sub', {all: fmt(T('request') + T('dns_query')), n: fmt(T('ad') + T('tracker'))}), '', t('kpi.share.tip'));
  // 内訳
  $('#breakdown').innerHTML = `<tr><th>${t('breakdown.feature')}</th><th class="num">${t('breakdown.count')}</th></tr>` +
    CATS.map(k => `<tr><td>${esc(catLabel(k))}</td><td class="num">${fmt(T(k))}</td></tr>`).join('');
  // 上位ドメイン
  const topTable = (rows, cls) => {
    if (!rows.length) return `<tr><td class="muted">${t('nodata')}</td></tr>`;
    const max = rows[0].count;
    return rows.map(x => `<tr><td style="width:46%">${esc(x.domain)}</td><td><div class="bar ${cls}" style="width:${Math.max(3, x.count / max * 100)}%"></div></td><td class="num" style="width:70px">${fmt(x.count)}</td></tr>`).join('');
  };
  $('#top-ad').innerHTML = topTable(r.top.ad || [], '');
  $('#top-tracker').innerHTML = topTable(r.top.tracker || [], 't');
  // 最近
  $('#recent').innerHTML = `<tr><th>${t('col.time')}</th><th>${t('col.kind')}</th><th>${t('col.route')}</th><th>${t('col.domain')}</th><th>${t('col.detail')}</th></tr>` + (r.recent.map(x =>
    `<tr><td>${new Date(x.ts * 1000).toLocaleTimeString(LOCALE)}</td><td><span class="tag">${esc(catLabel(x.category))}</span></td><td>${esc(['proxy', 'dns', 'page'].includes(x.source) ? t('route.' + x.source) : x.source)}</td><td>${esc(x.domain)}</td><td class="d" title="${esc(x.detail)}">${esc(x.detail)}</td></tr>`).join('') || `<tr><td class="muted" colspan="5">${t('nodata')}</td></tr>`);
  // グラフ
  let points;
  if (DAYS === 1) {
    $('#chart-title').textContent = t('chart.today');
    points = Array.from({length: 24}, (_, h) => { const k = String(h).padStart(2, '0'); const v = r.hourly[k] || {}; return {label: t('chart.hour', {h}), ad: v.ad || 0, tracker: v.tracker || 0}; });
  } else {
    $('#chart-title').textContent = t('chart.daily');
    const days = DAYS || Math.max(7, Object.keys(r.daily).length);
    points = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const v = r.daily[key] || {};
      points.push({label: (d.getMonth() + 1) + '/' + d.getDate(), ad: v.ad || 0, tracker: v.tracker || 0});
    }
  }
  drawChart(points);
  $('#updated').textContent = t('updated', {time: new Date().toLocaleTimeString(LOCALE)});
}

function drawChart(points) {
  const el = $('#chart');
  const W = el.clientWidth || 520, H = 220, L = 44, B = 24, T = 8, R = 6;
  const max = Math.max(4, ...points.map(p => p.ad + p.tracker));   // 小さい値でも目盛りが整数になるように
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const n = points.length, slot = (W - L - R) / n, bw = Math.max(2, Math.min(28, slot * 0.62));
  const y = v => T + (H - T - B) * (1 - v / nice);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(t('chart.aria'))}">`;
  for (let i = 0; i <= 4; i++) {
    const v = nice * i / 4, yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`;
  }
  const every = Math.ceil(n / 12);
  points.forEach((p, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const ya = y(p.ad), yt = y(p.ad + p.tracker);
    const r = Math.min(4, bw / 2);
    // 下: 広告, 上: トラッカー（区切りに 2px の隙間）
    if (p.ad) s += `<rect x="${x}" y="${ya}" width="${bw}" height="${y(0) - ya}" fill="var(--series-1)" rx="${p.tracker ? 0 : r}"/>`;
    if (p.tracker) s += `<rect x="${x}" y="${yt}" width="${bw}" height="${Math.max(0, ya - yt - (p.ad ? 2 : 0))}" fill="var(--series-2)" rx="${r}"/>`;
    s += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent" data-p="${i}"/>`;
    if (i % every === 0) s += `<text x="${L + slot * i + slot / 2}" y="${H - 6}" text-anchor="middle">${p.label}</text>`;
  });
  s += '</svg><div class="tip"></div>';
  el.innerHTML = s;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('rect[data-p]').forEach(rc => {
    rc.onmousemove = e => {
      const p = points[+rc.dataset.p];
      tip.innerHTML = `<b>${p.label}</b><br><span style="color:var(--series-1)">■</span> ${t('cat.ad')} ${fmt(p.ad)}<br><span style="color:var(--series-2)">■</span> ${t('cat.tracker')} ${fmt(p.tracker)}`;
      tip.style.display = 'block';
      const bx = el.getBoundingClientRect();
      let left = e.clientX - bx.left + 12; if (left > W - 150) left -= 170;
      tip.style.left = left + 'px'; tip.style.top = (e.clientY - bx.top - 10) + 'px';
    };
    rc.onmouseleave = () => tip.style.display = 'none';
  });
}

function toggles(container, keys, prefix, section) {
  $(container).innerHTML = keys.map(k => { const [name, desc] = t(prefix + k); return `<label class="toggle"><span class="switch"><input type="checkbox" data-k="${k}" ${CFG[section][k] ? 'checked' : ''}><span></span></span><span><div class="t">${esc(name)}</div><div class="d">${esc(desc)}</div></span></label>`; }).join('');
  $(container).querySelectorAll('input').forEach(i => i.onchange = async () => {
    const patch = {}; patch[section] = {}; patch[section][i.dataset.k] = i.checked;
    const r = await api('/api/config', patch); CFG = r.config; toast(t('toast.saved'));
  });
}
function chips(container, list, key) {
  $(container).innerHTML = list.length ? list.map((h, i) => `<span class="chip">${esc(h)}<button data-n="${i}" title="${esc(t('remove'))}">×</button></span>`).join('') : `<span class="muted small">${t('none')}</span>`;
  $(container).querySelectorAll('button').forEach(b => b.onclick = async () => {
    const next = CFG[key].filter((_, i) => i !== +b.dataset.n);
    const r = await api('/api/config', {[key]: next}); CFG = r.config; renderConfig();
  });
}
function addTo(inputSel, key) {
  const v = $(inputSel).value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '').toLowerCase();
  if (!v) return;
  if (!CFG[key].includes(v)) api('/api/config', {[key]: CFG[key].concat([v])}).then(r => { CFG = r.config; renderConfig(); toast(t('toast.added', {v})); });
  $(inputSel).value = '';
}

async function loadRecentSites() {
  const r = await api('/api/log?action=page&limit=300');
  const seen = [];
  for (const e of r.items) {
    const h = (e.host || '').replace(/^www\./, '');
    if (h && !seen.includes(h)) seen.push(h);
    if (seen.length >= 12) break;
  }
  const wl = (CFG && CFG.whitelist) || [];
  const list = seen.filter(h => !wl.some(w => h === w || h.endsWith('.' + w)));
  $('#recent-sites').innerHTML = list.length
    ? list.map(h => `<span class="chip">${esc(h)}<button class="btn mini" data-site="${esc(h)}" style="margin-left:4px">${t('recent.add')}</button></span>`).join('')
    : `<span class="muted small">${t('recent.none')}</span>`;
  $('#recent-sites').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const v = b.dataset.site;
    const res = await api('/api/config', {whitelist: CFG.whitelist.concat([v])}); CFG = res.config; renderConfig(); loadRecentSites();
    toast(t('toast.added', {v}));
  });
}
